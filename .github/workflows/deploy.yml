name: Deploy to mirror
on: [push]
jobs:
  deploy:
    name: Deploy to mirror
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Pull changes
        #run: cd $MIRROR_BASEPATH && sudo -u $MIRROR_USER2 -H git fetch && sudo -u $MIRROR_USER2 -H git reset --hard origin/master
        run: cd $MIRROR_BASEPATH && sudo -u $MIRROR_USER2 -H git pull
        env:
          MIRROR_BASEPATH: ${{ secrets.MIRROR_BASEPATH }}
          MIRROR_USER2: ${{ secrets.MIRROR_USER2 }}
      - name: Deploy mods to new mirror
        run: rclone sync $MIRROR_BASEPATH/mods/ technic-r2:technic-mods/mods/ --fast-list --checksum
        env:
          MIRROR_BASEPATH: ${{ secrets.MIRROR_BASEPATH }}
