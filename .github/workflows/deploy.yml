name: Deploy to production

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  deploy-and-sync:
    name: Deploy, sync, and prune
    runs-on: self-hosted
    env:
      # Secrets
      MIRROR_BASEPATH: ${{ secrets.MIRROR_BASEPATH }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # Vars
      R2_BASE_URL: ${{ vars.MIRROR_R2_BASE_URL }}
    steps:
      - name: Git pull and calculate diffs
        id: git-ops
        run: |
          set -euo pipefail
          cd "$MIRROR_BASEPATH"

          OLD_SHA=$(git rev-parse HEAD)
          git pull
          NEW_SHA=$(git rev-parse HEAD)

          # Generate Lists
          # List A: Files to UPLOAD (Added, Copied, Modified, Renamed, Type changed)
          # We exclude 'D' here so rclone doesn't crash trying to upload missing files.
          git diff --name-only --diff-filter=ACMRT "$OLD_SHA" "$NEW_SHA" -- mods/ > /tmp/files_to_upload.txt || true

          # List B: Files to DELETE (Deleted only)
          git diff --name-only --diff-filter=D "$OLD_SHA" "$NEW_SHA" -- mods/ > /tmp/files_to_delete.txt || true
          
          # List C: ALL changes (for Cloudflare Purge)
          git diff --name-only "$OLD_SHA" "$NEW_SHA" -- mods/ > /tmp/files_changed_all.txt || true

          if [ -s /tmp/files_to_upload.txt ]; then echo "has_uploads=true" >> "$GITHUB_OUTPUT"; else echo "has_uploads=false" >> "$GITHUB_OUTPUT"; fi
          if [ -s /tmp/files_to_delete.txt ]; then echo "has_deletes=true" >> "$GITHUB_OUTPUT"; else echo "has_deletes=false" >> "$GITHUB_OUTPUT"; fi
          if [ -s /tmp/files_changed_all.txt ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi

          # Summary
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Range:** $OLD_SHA..$NEW_SHA" >> $GITHUB_STEP_SUMMARY
          echo "**Uploads:** $(wc -l < /tmp/files_to_upload.txt)" >> $GITHUB_STEP_SUMMARY
          echo "**Deletions:** $(wc -l < /tmp/files_to_delete.txt)" >> $GITHUB_STEP_SUMMARY

      - name: Rclone upload (sync modified)
        if: steps.git-ops.outputs.has_uploads == 'true'
        run: |
          # Sync only the files that were added or modified
          rclone sync "$MIRROR_BASEPATH/" technic-r2:technic-mods/ \
            --fast-list \
            --checksum \
            --stats-one-line-date \
            -v \
            --files-from /tmp/files_to_upload.txt \
            --no-traverse

      - name: Rclone delete (remove deleted)
        if: steps.git-ops.outputs.has_deletes == 'true'
        run: |
          echo "Deleting the following files from R2:"
          cat /tmp/files_to_delete.txt
          
          # Explicitly delete files found in the deletion list
          rclone delete technic-r2:technic-mods/ \
            -v \
            --files-from /tmp/files_to_delete.txt

      - name: Purge CF cache
        if: steps.git-ops.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          
          # Use the ALL list (Uploads + Deletes) so we purge cache for removed files too
          mapfile -t ALL_FILES < /tmp/files_changed_all.txt

          echo "Purging ${#ALL_FILES[@]} files..."

          # Process in batches of 30 to respect Cloudflare API limits
          for ((i=0; i<${#ALL_FILES[@]}; i+=30)); do
            BATCH=("${ALL_FILES[@]:i:30}")
            
            # Create JSON payload
            PAYLOAD=$(printf '%s\n' "${BATCH[@]}" | \
              jq --raw-input --slurp --arg base "$R2_BASE_URL" \
              'split("\n") | map(select(length > 0)) | unique | map(. |= $base + .) | {files: .}')

            curl -X POST --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -d "$PAYLOAD"
            
            sleep 0.5s
          done

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/files_to_upload.txt /tmp/files_to_delete.txt /tmp/files_changed_all.txt
